# ==============================================================================
# NEXUS AI — Kiwix Offspot Production Docker Compose (Mode B: Raspberry Pi)
# ==============================================================================
# This Compose configuration is designed for real Kiwix Offspot hardware deployments
# on Raspberry Pi OS 64-bit (base-image).
#
# Persistence:
#   All persistent data is stored under /data on the dedicated ext4 data partition
#   which is automatically expanded to fill the entire SD card / SSD on first boot.
#
# Networking:
#   Hostapd & dnsmasq handle Wi-Fi AP, DHCP, and DNS (*.hotspot) on the host.
#   NEXUS listens on port 5000 and connects to the shared Offspot reverse proxy
#   network for seamless subdomain routing (http://nexus.hotspot).
# ==============================================================================

services:
  nexus-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nexus-ai:offspot
    container_name: nexus_offspot_app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - ENABLE_LAN_ACCESS=true
      - BASE_URL=http://nexus.hotspot
      - CORS_ORIGIN=*
      - DB_PATH=/app/data/nexus.sqlite
      - UPLOAD_DIR=/app/data/uploads
      - MAX_FILE_SIZE_BYTES=524288000
      - OFFSPOT_INTEGRATION=true
      - OFFSPOT_DOMAIN=nexus.hotspot
      - KIWIX_SERVICE_URL=http://browse.hotspot
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_MOCK_FALLBACK=true
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=240
      - AI_RATE_LIMIT_MAX_REQUESTS=60
    volumes:
      # Map to Offspot persistent /data partition
      - /data/nexus:/app/data
      # Read-only access to Kiwix ZIM storage for index sharing
      - /data/content/zims:/data/zims:ro
      # Read-only access to Offspot runtime config for truthful telemetry
      - /boot/firmware/offspot.yaml:/boot/firmware/offspot.yaml:ro
    ports:
      # Directly expose port 5000 for fallback access (http://10.0.0.1:5000)
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); http.get('http://127.0.0.1:5000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - offspot_net

  kiwix-serve:
    image: ghcr.io/offspot/kiwix-serve:3.8.2
    container_name: kiwix_serve
    restart: always
    volumes:
      - /data/content/zims:/data:ro
    ports:
      # Port 8080 for direct Kiwix ZIM browser
      - "8080:80"
    command: ["kiwix-serve", "--port=80", "/data/*.zim"]
    networks:
      - offspot_net

networks:
  offspot_net:
    name: offspot_network
    driver: bridge
